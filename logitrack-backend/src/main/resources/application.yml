spring:
  application:
    name: logitrack-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    # Dados demonstrativos pertencem somente ao perfil dev. O comportamento
    # seguro dos demais perfis e executar apenas as evolucoes do schema.
    locations: classpath:db/migration

  jpa:
    hibernate:
      # `validate` de proposito: quem cria e altera tabela e o Flyway. Deixar o
      # Hibernate gerar schema (`update`/`create`) esconderia divergencia entre
      # entidade e banco em vez de acusar no boot.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Origem do frontend Next em desenvolvimento.
app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      required: false
      name: ${BOOTSTRAP_ADMIN_NAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  invitation:
    base-url: ${INVITATION_BASE_URL}
    expiration-hours: ${INVITATION_EXPIRATION_HOURS:48}
    require-https: false
  security:
    bff:
      shared-secret: ${BFF_SHARED_SECRET}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failed-attempts: ${LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      cleanup-interval: ${LOGIN_RATE_LIMIT_CLEANUP_INTERVAL:5m}
      max-tracked-identities: ${LOGIN_RATE_LIMIT_MAX_TRACKED_IDENTITIES:10000}

springdoc:
  swagger-ui:
    # Documentacao em /docs; a raiz redireciona para ca (RootRedirectConfig).
    path: /docs
    # Ordena as operacoes por metodo em vez de alfabeticamente.
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    # O perfil local permite inspecionar as consultas nativas do dashboard.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
