spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    # Producao nunca carrega a massa demonstrativa de db/seed.
    locations: classpath:db/migration

  jpa:
    show-sql: false

server:
  # Render recomenda a porta 10000. PORT tem precedencia quando a plataforma
  # ou o operador definir outro valor; SERVER_PORT continua aceito em Docker.
  port: ${PORT:${SERVER_PORT:10000}}
  # Faz getRemoteAddr() refletir o cliente encaminhado pelo proxy do Render.
  # Esta estrategia pressupoe que a aplicacao esteja atras do proxy confiavel.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
  bootstrap:
    admin:
      # Um banco de producao vazio nao pode ficar sem uma conta administrativa.
      required: true
  invitation:
    # Impede que um convite de producao aponte para localhost por engano.
    base-url: ${INVITATION_BASE_URL}
    require-https: true
  security:
    login-rate-limit:
      # O armazenamento local atende somente uma instancia. Antes de escalar
      # horizontalmente, estes contadores devem migrar para Redis ou similar.
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-failed-attempts: ${LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      cleanup-interval: ${LOGIN_RATE_LIMIT_CLEANUP_INTERVAL:5m}
      max-tracked-identities: ${LOGIN_RATE_LIMIT_MAX_TRACKED_IDENTITIES:10000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
